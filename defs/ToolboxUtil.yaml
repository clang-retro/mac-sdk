- function:
    name: WideAdd
    return: wide*
    args:
    - name: target
      type: wide*
    - name: source
      type: const wide*
    comment: 64-bit integer arithmetic
    m68k-body: |
      unsigned long lo = target->lo + source->lo;
      target->hi += source->hi + (lo < target->lo);
      target->lo = lo;
      return target;

# ####

- function:
    name: WideSubtract
    return: wide*
    args:
    - name: target
      type: wide*
    - name: source
      type: const wide*
    m68k-body: |
      unsigned long lo = target->lo - source->lo;
      target->hi -= source->hi + (lo > target->lo);
      target->lo = lo;
      return target;

# ####

- function:
    name: WideCompare
    return: INTEGER
    args:
    - name: target
      type: const wide*
    - name: source
      type: const wide*
    m68k-body: |
      if (target->hi != source->hi)
          return target->hi < source->hi ? -1 : 1;
      if (target->lo != source->lo)
          return target->lo < source->lo ? -1 : 1;
      return 0;

# ####

- function:
    name: WideNegate
    return: wide*
    args:
    - name: target
      type: wide*
    m68k-body: |
      target->lo = ~target->lo + 1;
      target->hi = ~target->hi + (target->lo == 0);
      return target;

