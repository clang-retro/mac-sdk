- function:
    name: WideAdd
    return: wide*
    args:
    - name: target
      type: wide*
    - name: source
      type: const wide*
    comment: 64-bit integer arithmetic
    m68k-body: |
      unsigned long lo = target->lo + source->lo;
      target->hi += source->hi + (lo < target->lo);
      target->lo = lo;
      return target;

# ####

- function:
    name: WideSubtract
    return: wide*
    args:
    - name: target
      type: wide*
    - name: source
      type: const wide*
    m68k-body: |
      unsigned long lo = target->lo - source->lo;
      target->hi -= source->hi + (lo > target->lo);
      target->lo = lo;
      return target;

# ####

- function:
    name: WideCompare
    return: INTEGER
    args:
    - name: target
      type: const wide*
    - name: source
      type: const wide*
    m68k-body: |
      if (target->hi != source->hi)
          return target->hi < source->hi ? -1 : 1;
      if (target->lo != source->lo)
          return target->lo < source->lo ? -1 : 1;
      return 0;

# ####

- function:
    name: WideNegate
    return: wide*
    args:
    - name: target
      type: wide*
    m68k-body: |
      target->lo = ~target->lo + 1;
      target->hi = ~target->hi + (target->lo == 0);
      return target;

# ####

- function:
    name: WideShift
    return: wide*
    args:
    - name: target
      type: wide*
    - name: shift
      type: int32_t
    m68k-body: |
      /* Positive shifts right, rounding (halves up); negative shifts left. */
      long long n = (long long)(((unsigned long long)(UInt32)target->hi << 32) | target->lo);
      if (shift >= 64)
          n = 0;
      else if (shift > 0)
          n = (n >> shift) + ((n >> (shift - 1)) & 1);
      else if (shift <= -64)
          n = 0;
      else if (shift < 0)
          n = (long long)((unsigned long long)n << -shift);
      target->hi = (SInt32)(n >> 32);
      target->lo = (UInt32)n;
      return target;

# ####

- function:
    name: WideSquareRoot
    return: uint32_t
    args:
    - name: source
      type: const wide*
    m68k-body: |
      /* The source is unsigned; the root is rounded to nearest. */
      unsigned long long x = ((unsigned long long)(UInt32)source->hi << 32) | source->lo;
      unsigned long long r = 0, bit = 1ULL << 62;
      while (bit > x)
          bit >>= 2;
      while (bit) {
          if (x >= r + bit) {
              x -= r + bit;
              r = (r >> 1) + bit;
          } else {
              r >>= 1;
          }
          bit >>= 2;
      }
      if (x > r)
          r++;
      return r > 0xFFFFFFFFULL ? 0xFFFFFFFFUL : (uint32_t)r;

