- function:
    name: GetIndString
    args:
      - name: s
        type: StringPtr
      - name: sid
        type: INTEGER
      - name: index
        type: INTEGER
    executor: C_
    m68k-needs: [GetResource, BlockMoveData]
    m68k-body: |
      Handle h = GetResource(0x53545223, sid);    /* 'STR#' */
      unsigned char *p;
      s[0] = 0;
      if (!h || !*h)
          return;
      p = (unsigned char *)*h;
      if (index < 1 || index > *(INTEGER *)p)
          return;
      p += 2;
      while (--index)
          p += *p + 1;
      BlockMoveData(p, s, *p + 1);

