- function:
    name: GetIndPattern
    args:
      - name: op
        type: Byte*
      - name: plistid
        type: INTEGER
      - name: index
        type: INTEGER
    m68k-needs: [GetResource, BlockMoveData]
    m68k-body: |
      Handle h = GetResource(0x50415423, plistid);    /* 'PAT#' */
      Ptr p;
      if (!h || !*h || index < 1 || index > *(INTEGER *)*h)
          return;
      p = *h + 2 + (index - 1) * 8;
      BlockMoveData(p, op, 8);

