- function:
    name: Fix2X
    return: double
    args:
    - name: x
      type: Fixed
    comment: Conversions to floating point (68k needs SANE glue for these)
    m68k-body: |
      return (double)x / 65536.0;

# ####

- function:
    name: X2Fix
    return: Fixed
    args:
    - name: x
      type: double
    m68k-body: |
      /* Round to nearest (ties to even), as SANE does; out of range gives
         the largest Fixed of that sign. */
      double v = x * 65536.0;
      long r;
      double d;
      if (v >= 2147483647.0)
          return 0x7FFFFFFF;
      if (v <= -2147483648.0)
          return (Fixed)0x80000000;
      r = (long)v;                    /* toward zero */
      d = v - (double)r;
      if (d > 0.5 || (d == 0.5 && (r & 1)))
          r++;
      else if (d < -0.5 || (d == -0.5 && (r & 1)))
          r--;
      return r;

# ####

- function:
    name: Frac2X
    return: double
    args:
    - name: x
      type: Fract
    m68k-body: |
      return (double)x / 1073741824.0;

# ####

- function:
    name: X2Frac
    return: Fract
    args:
    - name: x
      type: double
    m68k-body: |
      double v = x * 1073741824.0;
      long r;
      double d;
      if (v >= 2147483647.0)
          return 0x7FFFFFFF;
      if (v <= -2147483648.0)
          return (Fract)0x80000000;
      r = (long)v;
      d = v - (double)r;
      if (d > 0.5 || (d == 0.5 && (r & 1)))
          r++;
      else if (d < -0.5 || (d == -0.5 && (r & 1)))
          r--;
      return r;

