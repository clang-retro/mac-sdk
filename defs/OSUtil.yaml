- function:
    name: c2pstrcpy
    args:
      - name: dst
        type: Str255
      - name: src
        type: const char*
    carbon: only
    m68k-needs: [BlockMoveData]
    m68k-body: |
      /* volatile, so the length loop is not turned into a call to strlen */
      const volatile char *p = src;
      Size n = 0;
      while (n < 255 && p[n])
          n++;
      BlockMoveData(src, dst + 1, n);
      dst[0] = (unsigned char)n;

