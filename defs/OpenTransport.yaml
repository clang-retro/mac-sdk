- funptr:
    name: OTNotifyUPP
    tvector: true
    comment: 'A notifier: Open Transport calls it with the events of a provider.

      PowerPC Open Transport calls it directly (not through Mixed Mode), so

      NewOTNotifyUPP gives the function itself on both CPUs.'
