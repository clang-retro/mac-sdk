- enum:
    comment: Option levels.
    values:
    - name: INET_IP
      value: 0
    - name: INET_TCP
      value: 6
    - name: INET_UDP
      value: 17
- verbatim: "/* Option names. The BSD socket headers use some of the same names with\n   other values:\
    \ a file that includes <netinet/in.h> or <netinet/tcp.h>\n   first keeps their values. */\n#ifndef\
    \ TCP_NODELAY\n#define TCP_NODELAY 0x1\n#endif\n#ifndef TCP_MAXSEG\n#define TCP_MAXSEG 0x2\n#endif\n\
    #ifndef TCP_NOTIFY_THRESHOLD\n#define TCP_NOTIFY_THRESHOLD 0x10\n#endif\n#ifndef TCP_ABORT_THRESHOLD\n\
    #define TCP_ABORT_THRESHOLD 0x11\n#endif\n#ifndef TCP_CONN_NOTIFY_THRESHOLD\n#define TCP_CONN_NOTIFY_THRESHOLD\
    \ 0x12\n#endif\n#ifndef TCP_CONN_ABORT_THRESHOLD\n#define TCP_CONN_ABORT_THRESHOLD 0x13\n#endif\n\
    #ifndef TCP_OOBINLINE\n#define TCP_OOBINLINE 0x14\n#endif\n#ifndef TCP_URGENT_PTR_TYPE\n#define TCP_URGENT_PTR_TYPE\
    \ 0x15\n#endif\n#ifndef TCP_KEEPALIVE\n#define TCP_KEEPALIVE 0x8\n#endif\n#ifndef UDP_CHECKSUM\n#define\
    \ UDP_CHECKSUM 0x600\n#endif\n#ifndef IP_OPTIONS\n#define IP_OPTIONS 0x1\n#endif\n#ifndef IP_TOS\n\
    #define IP_TOS 0x2\n#endif\n#ifndef IP_TTL\n#define IP_TTL 0x3\n#endif\n#ifndef IP_REUSEADDR\n#define\
    \ IP_REUSEADDR 0x4\n#endif\n#ifndef IP_DONTROUTE\n#define IP_DONTROUTE 0x10\n#endif\n#ifndef IP_BROADCAST\n\
    #define IP_BROADCAST 0x20\n#endif\n#ifndef IP_REUSEPORT\n#define IP_REUSEPORT 0x200\n#endif\n#ifndef\
    \ IP_HDRINCL\n#define IP_HDRINCL 0x1002\n#endif\n#ifndef IP_RCVOPTS\n#define IP_RCVOPTS 0x1005\n#endif\n\
    #ifndef IP_RCVDSTADDR\n#define IP_RCVDSTADDR 0x1006\n#endif\n#ifndef IP_MULTICAST_IF\n#define IP_MULTICAST_IF\
    \ 0x1010\n#endif\n#ifndef IP_MULTICAST_TTL\n#define IP_MULTICAST_TTL 0x1011\n#endif\n#ifndef IP_MULTICAST_LOOP\n\
    #define IP_MULTICAST_LOOP 0x1012\n#endif\n#ifndef IP_ADD_MEMBERSHIP\n#define IP_ADD_MEMBERSHIP 0x1013\n\
    #endif\n#ifndef IP_DROP_MEMBERSHIP\n#define IP_DROP_MEMBERSHIP 0x1014\n#endif"
