    value: '"dnr"'
- define:
    name: kDefaultInternetServicesPath
    value: ((OTConfigurationRef)(long)-3)
- enum:
    comment: Events of the Internet services provider.
    values:
    - name: T_DNRSTRINGTOADDRCOMPLETE
      value: 268435457
    - name: T_DNRADDRTONAMECOMPLETE
      value: 268435458
    - name: T_DNRSYSINFOCOMPLETE
      value: 268435459
    - name: T_DNRMAILEXCHANGECOMPLETE
