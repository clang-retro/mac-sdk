- verbatim: "/* Open Transport TCP/IP: addresses, Internet services (the name\n   resolver) and the TCP,\
    \ UDP and IP options. */"
- typedef:
    name: InetPort
    type: UInt16
- typedef:
    name: InetHost
    type: UInt32
    comment: An IPv4 address in network order.
- typedef:
    name: InetSvcRef
    type: ProviderRef
    comment: An open Internet services provider. All provider calls take it.
- typedef:
    name: InetDomainName
    type: char[256]
- verbatim: '#ifndef AF_INET

    #define AF_INET 2

    #endif

    #ifndef AF_DNS

    #define AF_DNS 42

    #endif'
- enum:
    values:
    - name: kOTAnyInetAddress
      value: 0
    - name: kMaxHostAddrs
      value: 10
    - name: kMaxSysStringLen
      value: 32
    - name: kMaxHostNameLen
      value: 255
    - name: kDefaultInetInterface
      value: -1
    - name: kInetInterfaceInfoVersion
      value: 3
- define:
    name: kTCPName
    value: '"tcp"'
- define:
    name: kUDPName
    value: '"udp"'
- define:
    name: kRawIPName
    value: '"rawip"'
- define:
