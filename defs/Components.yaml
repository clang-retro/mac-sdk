- function:
    name: CallComponentFunctionWithStorageProcInfo
    return: int32_t
    args:
    - name: storage
      type: Handle
    - name: params
      type: ComponentParameters*
    - name: func
      type: ProcPtr
    - name: funcProcInfo
      type: int32_t
    m68k-needs: [CallComponentFunctionWithStorage]
    m68k-body: |
      /* On 68k there is no Mixed Mode, so the procedure information is not
         needed, as in Apple's interfaces. */
      (void)funcProcInfo;
      return CallComponentFunctionWithStorage(storage, params, (ComponentFunctionUPP)func);

