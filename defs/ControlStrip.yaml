# ####

- enum:
    values:
    - name: gestaltControlStripAttr
      value: '''sdev'''
    - name: gestaltControlStripExists
      value: 0
    - name: gestaltControlStripVersionFixed
      value: 1
    - name: gestaltControlStripUserFont
      value: 2
    - name: gestaltControlStripUserHotKey
      value: 3
    - name: gestaltControlStripVersion
      value: '''csvr'''
    comment: 'Control Strip: the Gestalt selector, and its bits.'
- dispatcher:
    name: ControlStripDispatch
    trap: 43762
    selector-location: D0W

# ####

- function:
    name: SBIsControlStripVisible
    return: Boolean
    comment: Control Strip (PowerBook, then all Macs from Mac OS 8). Trap 0xAAF2 with the selector
      in D0, as installed by the Control Strip extension.
    dispatcher: ControlStripDispatch
    selector: 0x0000

# ####

- function:
    name: SBShowHideControlStrip
    args:
    - name: showIt
      type: Boolean
    dispatcher: ControlStripDispatch
    selector: 0x0101
