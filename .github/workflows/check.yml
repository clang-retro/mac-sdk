# Run the SDK's tests with clang-retro's clang, for every pull request and
# push: compile every header for 68k and PowerPC, check record sizes and the
# ROM-checked argument blocks, build the examples, and check that the
# generated files (include/, docs/coverage.md) match their generators.
# It also builds the runtime library from compiler-rt and the C library
# from clang-retro/picolibc's main branch, and runs their tests, and builds
# the C++ library (libunwind from the same clang-retro/llvm commit,
# libstdc++ from the GCC 15.2.0 release) and runs its test.
#
# clang comes from clang-retro/llvm's llvm-prebuilt release, which holds the
# LLVM tools built from recent commits of its main branch; the newest Linux
# one is used.
name: Check

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.docs/**', 'mkdocs.yml', '.github/workflows/docs.yml', 'LICENSE*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.docs/**', 'mkdocs.yml', '.github/workflows/docs.yml', 'LICENSE*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml unicorn meson ninja
      - name: Get clang
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api repos/clang-retro/llvm/releases/tags/llvm-prebuilt --jq \
            '[.assets[] | select(.name | startswith("llvm-linux-"))] | sort_by(.created_at) | last | .name')
          echo "Using $asset"
          gh release download llvm-prebuilt -R clang-retro/llvm -p "$asset" -O llvm.tar.zst
          mkdir -p "$RUNNER_TEMP/llvm"
          tar --zstd -xf llvm.tar.zst -C "$RUNNER_TEMP/llvm"
          rm llvm.tar.zst
          echo "CLANG=$RUNNER_TEMP/llvm/bin/clang" >> "$GITHUB_ENV"
          # llvm-linux-COMMIT-SCRIPTHASH.tar.zst: compiler-rt from the same commit.
          sha=${asset#llvm-linux-}
          echo "LLVM_SHA=${sha%%-*}" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm/bin/clang" --version
      - name: Generated files are up to date
        run: |
          python3 tools/gen-headers.py
          python3 tools/coverage.py
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Get compiler-rt's builtins
        uses: actions/checkout@v4
        with:
          repository: clang-retro/llvm
          ref: ${{ env.LLVM_SHA }}
          path: llvm
          sparse-checkout: |
            compiler-rt/lib/builtins
            libunwind
          persist-credentials: false
      - name: Get picolibc
        uses: actions/checkout@v4
        with:
          repository: clang-retro/picolibc
          path: picolibc
          persist-credentials: false
      - name: Cache GCC's source
        uses: actions/cache@v4
        with:
          path: gcc-15.2.0.tar.xz
          key: gcc-15.2.0
      - name: Get GCC's source (for libstdc++)
        run: |
          [ -f gcc-15.2.0.tar.xz ] ||
            curl -fsSL -o gcc-15.2.0.tar.xz https://ftp.gnu.org/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz
          echo "438fd996826b0c82485a29da03a72d71d6e3541a83ec702df4271f6fe025d24e  gcc-15.2.0.tar.xz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/gcc"
          tar -xJf gcc-15.2.0.tar.xz -C "$RUNNER_TEMP/gcc"
          echo "GCC_SRC=$RUNNER_TEMP/gcc/gcc-15.2.0" >> "$GITHUB_ENV"
      - name: Get Quesa (the last commit with the classic Mac OS build)
        uses: actions/checkout@v4
        with:
          repository: jwwalker/Quesa
          ref: 883c9a0d218bd18c17f2f62024c0e57f2d5d4a07
          path: quesa
          sparse-checkout: |
            Development/Source
            SDK/Includes
          persist-credentials: false
      - name: Tests
        run: LLVM_SRC=$PWD/llvm PICOLIBC_SRC=$PWD/picolibc QUESA_SRC=$PWD/quesa tests/run.sh
      # The sysroot that dos-sdk's nightly release publishes: build it, and
      # build and run programs with it alone.
      - name: Sysroot
        run: |
          LLVM_SRC=$PWD/llvm PICOLIBC_SRC=$PWD/picolibc sh build-sysroot.sh "$RUNNER_TEMP/macos-classic" >"$RUNNER_TEMP/sysroot.log" 2>&1 ||
            { tail -50 "$RUNNER_TEMP/sysroot.log"; exit 1; }
          sh tests/sysroot.sh "$RUNNER_TEMP/macos-classic"
